<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Playlist</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2.1.1/css/pico.classless.min.css">
  </head>
  <body>
    <main>
      <h1>My CatList</h1>
      <p>Get information about a cat.</p>
      <button type="button" id="cat-button">Get a Cat</button> 
     <article class="card">
        <h3 id="cat-name">Press the button</h3>
        <p id="cat-facts"></p>
        <img id="cat-photo" src="cat-photo" alt="cats description" width="320" hidden>
      </article>
      <p>
        <a href="index.html">Back to playlist</a>
      </p>
     </main>
    <script src="cats.js"></script>
  </body>
</html>
