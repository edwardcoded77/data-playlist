<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Playlist</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2.1.1/css/pico.classless.min.css">
    <link rel="stylesheet" href="./css/card.css">
    <link rel="stylesheet" href="./css/style.css">
  </head>
  <body>
    <main>
        <h1 id="head-playlist">My Playlist</h1>
        <p id="par-id">Discover new tracks for your playlist</p>
        <button  type="button" id="song-button">Find a track</button>
      <div class="card">
          <h2 id="track-name">Track Name</h2>
          <p id="artist-name">Artist Name</p>
      </div>
      <div class="nextbak">
          <button id="back-button" type="button">Back</button>
          <button id="next-button" type="button">Next</button>
      </div>
      <div class="chart-card">
        <button id="top-button" type="button">Top of the chart</button>
        <button id="random-button" type="button">Random track</button>
      </div>
      <p id="track-count"></p>
    </main>
    <script src="script.js"></script>
  </body>
</html>
