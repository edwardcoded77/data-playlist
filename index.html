<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Playlist</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2.1.1/css/pico.classless.min.css">
    <link rel="stylesheet" href="./css/card.css">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  </head>
  <body>
    <main>
      <div class="playlist-container">
          <h2 id="head-playlist"><i class="fa-solid fa-music"></i> My Playlist</h2>
          <p id="par-id">Discover new tracks for your playlist</p>
          <button  type="button" id="song-button"><i class="fa-solid fa-list"></i> Find Tracks</button>
          <div class="count-container">
            <p id="track-count"></p>
            <p id="favs-count"></p>
          </div>   
        <div class="card">
          <h2 id="track-name">Track Name</h2><p id="artist-name">Artist Name</p>
        </div>
        <div class="ButFav">
          <div class="button-container">
              <button id="back-button" type="button"><i class="fa-solid fa-backward"></i></button>
              <button id="random-button" type="button"><i class="fa-solid fa-shuffle"></i></button>
              <button id="save-button" type="button"><i class="fa-solid fa-heart"></i></button>
              <button id="next-button" type="button"><i class="fa-solid fa-forward"></i></button>
              <button id="top-button" type="button"><i class="fa-solid fa-arrow-up"></i></button>
            <!-- <button id="favs-button" type="button"> View Favorites <i class="fa-solid fa-heart"></i></button> -->
          </div>
        <!-- Favorites will appear here-->
         <div class="favs-container" id="favs-list">
            <button id="favs-button" type="button">View Favorites <i class="fa-solid fa-heart"></i>
            </button>
         </div>
        </div>
        </div>
      </main>
      <script src="script.js"></script>
    </body>
  </html>
